stages:
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - backend/.gradle/

backend-tests:
  image: eclipse-temurin:21-jdk
  stage: test
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"